<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tonatiuh - Portafolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    
    <style>
        /* Estilos generales existentes */
        body {
            margin: 0;
            background-color: #ffffff;
            color: #091434;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        * {
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
        }

        #main-content {
            flex: 1;
            /* Aquí se renderizará el resto del contenido de tu página */
            padding: 20px;
        }

        /* ==========================================
           ESTILOS EXCLUSIVOS DEL PIE DE PÁGINA (FOOTER)
           ========================================== */
        footer {
            width: 100%;
            background-color: #ffffff;
            border-top: 1px solid #e2e8f0;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: auto;
        }

        footer p {
            margin: 0;
            font-size: 0.9rem;
            color: #64748b;
            text-align: center;
        }

        .footer-links {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.9rem;
        }

        .footer-links a {
            color: #091434;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: #334155;
            text-decoration: underline;
        }

        .footer-divider {
            color: #cbd5e1;
            user-select: none;
        }

        @media (max-width: 480px) {
            .footer-links {
                flex-direction: column;
                gap: 8px;
            }
            .footer-divider {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- Contenedor principal de tu sitio -->
    <div id="main-content">
        <!-- El contenido actual de tu página (secciones, chatbot, etc.) se mantiene intacto aquí -->
    </div>

    <!-- ==========================================
         CÓDIGO AGREGADO: PIE DE PÁGINA LEGAL
         ========================================== */ -->
    <footer>
        <p>© 2026 Tonatiuh Garza. Todos los derechos reservados.</p>
        <div class="footer-links">
            <!-- Enlace que abre el Aviso Legal en pestaña nueva -->
            <a href="/legal.html" target="_blank" rel="noopener noreferrer">Aviso Legal</a>
            
            <span class="footer-divider">|</span>
            
            <!-- Enlace que abre la Política de Privacidad en pestaña nueva -->
            <a href="/privacy.html" target="_blank" rel="noopener noreferrer">Política de Privacidad</a>
        </div>
    </footer>

</body>

</html>
